# Docs - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Amd Graphical Bug Report
description: Graphical Issue (Only use this template if have graphical issues on an AMD GPU).
title: Placeholder
labels: [AMD GPU BUG]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Important: Read First

        Please check reported issues before submitting your bug report.

  - type: textarea
    id: desc
    attributes:
      label: Describe the Bug
      description: "A clear and concise description of what the bug is"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: "Steps to reproduce the behavior"
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: Expected Behavior
      description: "A clear and concise description of what you expected to happen"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## System Info

  - type: input
    id: rev
    attributes:
      label: Xbased Version Release
      description: "We only accept bug reports for the latest dev version. Please try upgrading before making an issue."
      placeholder: "Example: 1.0.54"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
      - Windows 11
      - Windows 10 (64bit)
      - Linux (64bit) - Specify distro below
    validations:
      required: true
  - type: input
    id: os-distro
    attributes:
      label: If Linux - Specify Distro
      placeholder: "Example: Arch"
    validations:
      required: false
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Example: Intel Core Ultra 5 250K Plus/AMD Ryzen 9 9600X"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "Example: Nvidia RTX 5060"
    validations:
      required: true
  - type: textarea
    id: Settings
    attributes:
      label: Emulation Settings
      description: "Any **non-default** settings including from video and system settings . If you don't want to list them out, please provide screenshots of your configuration window."
    validations:
      required: false
  - type: textarea
    id: Logfile
    attributes:
      label: "Logs"
      description: |
        Please attach any logs here.
    validations:
      required: true
